<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>iframe-child</title></head>
<body>
  <h1 id="heading">child page</h1>
  <button id="btn" onclick="window.__clicked=(window.__clicked||0)+1;document.getElementById('heading').textContent='clicked:'+window.__clicked">hit me</button>
  <script>
    window.__clicked = 0;
  </script>
</body></html>
